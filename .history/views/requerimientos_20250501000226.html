<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestión de Requerimientos</title>
  <link rel="stylesheet" href="../css/requerimientos.css">
</head>
<body>
  <header>
    <h1>Gestión de Requerimientos</h1>
    <nav>
      <a href="dashboard.html">Inicio</a>
      <a href="proveedores.html">Proveedores</a>
      <a href="../index.html">Salir</a>
    </nav>
  </header>

  <main>
    <section class="formulario">
      <h2>Nuevo Requerimiento</h2>
      <form id="formRequerimiento">
        <label>Material:
          <input type="text" name="material" required>
        </label>
        <label>Cantidad:
          <input type="number" name="cantidad" required>
        </label>
        <label>Área solicitante:
          <input type="text" name="area" required>
        </label>
        <button type="submit">Registrar</button>
      </form>
    </section>

    <section class="lista">
      <h2>Requerimientos Registrados</h2>
      <table>
        <thead>
          <tr>
            <th>Material</th>
            <th>Cantidad</th>
            <th>Área</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaRequerimientos">
          <!-- Datos dinámicos -->
        </tbody>
      </table>
    </section>
  </main>

  <script src="../js/requerimientos.js"></script>
</body>
</html>
