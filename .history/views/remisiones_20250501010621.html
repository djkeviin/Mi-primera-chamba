<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestión de Remisiones</title>
  <link rel="stylesheet" href="../css/remisiones.css">
</head>
<body>
  <header>
    <h1>Gestión de Remisiones</h1>
    <nav>
      <a href="dashboard.html">Inicio</a>
      <a href="proveedores.html">Proveedores</a>
      <a href="../index.html">Salir</a>
    </nav>
  </header>

  <main>
    <section class="formulario">
      <h2>Registrar Remisión</h2>
      <form id="formRemision">
        <label>Producto:
          <input type="text" name="producto" required>
        </label>
        <label>Cantidad:
          <input type="number" name="cantidad" required>
        </label>
        <label>Fecha de Entrega:
          <input type="date" name="fecha" required>
        </label>
        <label>Proveedor:
          <input type="text" name="proveedor" required>
        </label>
        <label>Observaciones:
          <textarea name="observaciones"></textarea>
        </label>
        <button type="submit">Registrar Remisión</button>
      </form>
    </section>

    <section class="lista">
      <h2>Remisiones Registradas</h2>
      <table>
        <thead>
          <tr>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Fecha de Entrega</th>
            <th>Proveedor</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaRemisiones">
          <!-- Datos dinámicos -->
        </tbody>
      </table>
    </section>
  </main>

  <script src="../js/remisiones.js"></script>
</body>
</html>
