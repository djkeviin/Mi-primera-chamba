<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Órdenes de Compra</title>
  <link rel="stylesheet" href="../css/ordenes.css">
</head>
<body>

<header>
  <h1>Gestión de Órdenes de Compra</h1>
  <nav>
    <a href="dashboard.html">Inicio</a>
    <a href="proveedores.html">Proveedores</a>
    <a href="../index.html">Salir</a>
  </nav>
</header>

<main>
  <section class="formulario">
    <h2>Crear Orden</h2>
    <form id="formOrden">
      <label>Número de Orden:
        <input type="text" id="numero" name="numero" required>
      </label>
      <label>Proveedor:
        <input type="text" id="proveedor" name="proveedor" required>
      </label>
      <label>Fecha:
        <input type="date" id="fecha" name="fecha" required>
      </label>
      <label>Detalle:
        <textarea id="detalle" name="detalle" required></textarea>
      </label>
      <button type="submit">Registrar Orden</button>
    </form>
  </section>

  <section class="lista">
    <h2>Órdenes Registradas</h2>
    <table>
      <thead>
        <tr>
          <th>Número</th>
          <th>Proveedor</th>
          <th>Fecha</th>
          <th>Detalle</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaOrdenes">
        <!-- Órdenes insertadas dinámicamente -->
      </tbody>
    </table>
  </section>

  <section class="seleccion-requerimientos">
    <h2>Seleccionar Requerimientos</h2>
    <table>
      <thead>
        <tr>
          <th>Seleccionar</th>
          <th>Material</th>
          <th>Cantidad</th>
          <th>Área</th>
          <th>Fecha</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody id="tablaRequerimientos">
        <!-- Requerimientos cargados desde localStorage -->
      </tbody>
    </table>
  </section>

  <button id="btnAgregarRequerimientos" style="margin-top: 10px;">Agregar Requerimientos Seleccionados</button>

</main>

<script src="../js/ordenes.js"></script>
</body>
</html>
