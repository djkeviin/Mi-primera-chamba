<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Órdenes de Pago</title>
  <link rel="stylesheet" href="../css/pagos.css">
</head>
<body>
  <header>
    <h1>Órdenes de Pago</h1>
    <nav>
      <a href="dashboard.html">Inicio</a>
      <a href="facturas.html">Facturas</a>
      <a href="../index.html">Salir</a>
    </nav>
  </header>

  <main>
    <section class="formulario">
      <h2>Registrar Pago</h2>
      <form id="formPago">
        <label>Número de Orden:
          <input type="text" name="orden" required>
        </label>
        <label>Proveedor:
          <input type="text" name="proveedor" required>
        </label>
        <label>Monto a Pagar:
          <input type="number" name="monto" required>
        </label>
        <label>Fecha de Pago:
          <input type="date" name="fecha" required>
        </label>
        <button type="submit">Registrar</button>
      </form>
    </section>

    <section class="lista">
      <h2>Pagos Realizados</h2>
      <table>
        <thead>
          <tr>
            <th>Orden</th>
            <th>Proveedor</th>
            <th>Monto</th>
            <th>Fecha</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaPagos">
          <!-- Registros dinámicos -->
        </tbody>
      </table>
    </section>
  </main>

  <script src="../js/pagos.js"></script>
</body>
</html>
