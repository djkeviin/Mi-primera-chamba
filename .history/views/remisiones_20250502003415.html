<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestión de Remisiones</title>
  <link rel="stylesheet" href="../css/remisiones.css">
</head>
<body>
  <header>
    <h1>Gestión de Remisiones</h1>
    <nav>
      <a href="dashboard.html">Inicio</a>
      <a href="facturas.html">Facturas</a>
      <a href="../index.html">Salir</a>
    </nav>
  </header>

  <main>
    <section class="formulario">
      <h2>Registrar Remisión</h2>
      <form id="formRemision">
        <label>Proveedor:
          <input type="text" name="proveedor" required>
        </label>
        <label>Fecha de Recepción:
          <input type="date" name="fechaRecepcion" required>
        </label>
        <label>Estado de Calidad:
          <input type="text" name="estadoCalidad" required>
        </label>
        <button type="submit">Registrar</button>
        <a href="/views/reclamos.html"><button>Nota De Reclamo</button></a>
      </form>
    </section>

    <section class="lista">
      <h2>Remisiones Registradas</h2>
      <table>
        <thead>
          <tr>
            <th>Proveedor</th>
            <th>Fecha Recepción</th>
            <th>Estado Calidad</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaRemisiones">
          <!-- Datos dinámicos -->
        </tbody>
      </table>
    </section>
  </main>

  <script src="../js/remisiones.js"></script>
</body>
</html>
